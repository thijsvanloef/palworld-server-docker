---
services:
  palworld:
    extends:
      file: ../../windows.yaml
      service: palworld
    build:
      context: ../../
    environment:
      SERVER_NAME: "palworld-server-docker/examples/mods"
      MOD_ENABLED: true
      MOD_UPDATE_ON_BOOT: true
      #MOD_DEBUG: true

      # ------------------------------------------------------------
      # MOD install method A: Steam Workshop IDs in env var
      # - Comma-separated workshop IDs
      # ------------------------------------------------------------
      MOD_IDS: "3625287786${MODS:+,}${MODS:-}"

      # ------------------------------------------------------------
      # MOD install method B: Using workshop-mods.txt file
      # - Line-separated IDs in /palworld/Mods/workshop-mods.txt
      # - It is combined with WORKSHOP_MOD_IDS
      # ------------------------------------------------------------

      # ------------------------------------------------------------
      # MOD install method C: NativeMods (manual mod folders)
      # - Put extracted mods under:
      #   ./palworld/Mods/NativeMods/<mod_name>/...
      # - `mods-update` auto-deploys these on startup/sync
      # ------------------------------------------------------------

      # ------------------------------------------------------------
      # Optional: Override UE4SS URL and PalSchema mod ID
      # ------------------------------------------------------------
      # MOD_URL_UE4SS: "https://github.com/Okaetsu/RE-UE4SS/releases/download/experimental-palworld/UE4SS-Palworld.zip"
      # MOD_ID_PALSCHEMA: "3625280368"

      # If workshop mods require account auth:
      # 1) run ./save-login-credential.sh once before startup
      # 2) provide only STEAM_USERNAME (no password in compose)
      STEAM_USERNAME: "${STEAM_USERNAME:-}"

    volumes:
      - ../../palworld:/palworld/
